[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wms-cli"
version = "0.1.0"
description = "WMS CLI with fuzzy search and natural dimension syntax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "textual>=0.40.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "rapidfuzz>=3.0.0",
    "click>=8.0.0",
]

[project.scripts]
wms = "src.wms.cli:main"
edr = "src.edr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
